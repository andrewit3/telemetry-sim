[project]
name = "telemetry-sim"
version = "0.1.0"
description = "Website telemetry simulator with observable ground-truth DGP for causal inference research"
readme = "README.md"
authors = [
    { name = "Andrew", email = "agregory716@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
telemetry-sim = "telemetry_sim:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
